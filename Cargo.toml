[package]
name = "fttyd"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Web terminal with a system stats sidebar and file manager, drop-in compatible with ttyd"
license = "MIT"
readme = "README.md"

[dependencies]
axum = { version = "0.8.9", features = ["ws", "multipart", "http1", "query", "tokio"] }
base64 = "0.23.1"
bytes = "1.12.1"
flate2 = "1.1.11"
futures-util = "0.3.34"
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
libc = "0.2.191"
nix = { version = "0.32.0", features = ["user", "fs", "net"] }
percent-encoding = "2.3.2"
portable-pty = "0.9.0"
rust-embed = { version = "8.14.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.36.1"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "9.6.0", default-features = false, features = ["deflate", "deflate64"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
