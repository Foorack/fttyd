<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="fttyd">
  <!-- Original artwork, no third-party logo: a dark slate tile with an amber-to-orange
       prompt, sized so the chevron and the bar still read at 16px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#222c38"/>
      <stop offset="1" stop-color="#080d13"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" fill="none" stroke="url(#rim)"/>
  <path d="M8.5 10.5 15.5 16.5 8.5 22.5" fill="none" stroke="url(#prompt)" stroke-width="3.4"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="18" y="19.2" width="8" height="3.4" rx="1.7" fill="url(#prompt)"/>
</svg>
