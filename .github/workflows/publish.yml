name: Publish

# Tag-driven release to crates.io. Authentication is OIDC trusted publishing: no API
# token is stored anywhere, crates.io hands out a 30-minute token for this exact
# workflow file in this exact repository.
on:
  push:
    tags: ["v*"]
  # So a broken release can be rehearsed without spending a version number.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and verify, but do not upload
        type: boolean
        default: true

permissions:
  contents: read
  # Required to request the OIDC token that crates.io exchanges for a publish token.
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2

      # The published crate carries the built bundle, so it has to be built before
      # packaging; untracked `web/dist` is why the publish itself needs --allow-dirty.
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web

      - name: Check the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - run: cargo test --locked
      - run: cargo package --locked --allow-dirty

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: github.event_name == 'push' || !inputs.dry_run
        run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: cargo publish --locked --allow-dirty --dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
