name: CI

# Every push, every branch, and every pull request. The author check inspects each
# commit in the pushed range rather than only the tip, so a bad trailer cannot hide in
# the middle of a branch.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1

jobs:
  authors:
    name: author check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The check needs the commits, not just the working tree.
          fetch-depth: 0

      - name: Reject AI attribution
        env:
          # Picks the range for this event; see scripts/ci-author-check.sh for the rules.
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/ci-author-check.sh

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  frontend:
    name: frontend typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: bun run typecheck
      - name: Build
        working-directory: web
        run: bun run build

  lint:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # build.rs compiles the frontend into the binary, so bun has to be available.
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The suite drives the real binary, so it has to be built in debug exactly as the
      # harness expects (target/debug/fttyd).
      - run: cargo build --locked
      # bunx resolves `playwright` from e2e/node_modules; without the lockfile install it
      # would download a floating version that disagrees with the locked browser build.
      - name: Install
        working-directory: e2e
        run: bun install --frozen-lockfile
      - name: Install Playwright's browser
        working-directory: e2e
        run: bunx playwright install --with-deps chromium
      # ttyd's own client is only fetched for the conformance test, which skips itself
      # when the cache is missing, so no network clone of ttyd is needed here.
      - name: Run
        working-directory: e2e
        run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/test-results
          if-no-files-found: ignore

  container:
    name: container checks
    # The script bind-mounts a host-built binary into the container, so the container's
    # glibc cannot be older than the one it was linked against. Both sides are pinned
    # to the same Ubuntu release; `latest` here and `bookworm` in the image would drift
    # apart and fail at exec with a GLIBC version error.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTTYD_TEST_IMAGE: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      # Needs root inside a disposable container: privilege dropping, socket ownership,
      # permission errors and special files. The runner has docker; the disk-full check
      # skips itself when it cannot mount a tmpfs.
      - run: ./scripts/docker-tests.sh
